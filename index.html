<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body, html {
    background: black;
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: white;
  }
  #loading {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    color: white;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {0%{opacity:1;}50%{opacity:0;}100%{opacity:1;}}
  #timer {position:absolute;top:10px;right:10px;font-size:18px;color:lime;}
</style>
</head>
<body>
<div id="loading">LOADING...</div>
<div id="timer">0 сек</div>

<script>
let startTime=Date.now();
setInterval(()=>{
  document.getElementById('timer').innerText=Math.floor((Date.now()-startTime)/1000)+" сек";
},1000);
</script>
</body>
</html>
