<!DOCTYPE html>
<html>
<head>
<style>
  body {background:black;color:white;font-family:'Press Start 2P', monospace;}
  #supaplex {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:32px;
  }
</style>
</head>
<body>
<div id="loading">LOADING...</div>
<div id="supaplex">SUPAPLEX</div>
<div id="timer">0 sec</div>

<script>
let startTime=Date.now();
setInterval(()=>{
  document.getElementById('timer').innerText=Math.floor((Date.now()-startTime)/1000)+" сек";
},1000);
</script>
</body>
</html>
